name = "zfb-example-kv-guestbook"
main = "./dist/_worker.js"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Top-level fields MUST stay above the [assets] and [[kv_namespaces]] tables. In
# TOML any key written after a table header is scoped INTO that table, so a
# workers_dev/preview_urls placed below either one is silently ignored — wrangler
# only warns "Unexpected fields found in assets field" and deploys without them.
#
# workers_dev keeps the public *.workers.dev subdomain
# (zfb-example-kv-guestbook.takazudo.workers.dev) serving alongside the custom
# domain below. It is also what makes preview URLs route at all: with workers_dev
# disabled Cloudflare still PRINTS the preview URL at upload time, but the edge
# rejects requests to it with "error code: 1042".
workers_dev = true

# preview_urls defaults to *match* workers_dev rather than to true, so leaving it
# out silently couples per-deploy preview URLs to the production subdomain
# setting. Set it explicitly so previews survive a later workers_dev = false.
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

# The homepage is `prerender = false`, so the build emits NO dist/index.html —
# `/` is rendered by the Worker. But the asset layer is consulted first, and for
# a NAVIGATION request (one carrying `sec-fetch-mode: navigate`, which every real
# browser sends) an unmatched path is answered with `not_found_handling`. With a
# prerendered dist/404.html present, that meant `/` served the 404 page and the
# Worker never ran — the site was broken for every human visitor while curl,
# which sends no such header, fell through to the Worker and saw a correct 200.
#
# Running the Worker first for exactly these paths fixes it without giving up
# direct asset serving: real files under /assets/* are still returned by the
# asset layer without invoking the Worker.
run_worker_first = ["/", "/api/*"]

[[kv_namespaces]]
binding = "GUESTBOOK"
# Provisioned by .github/workflows/kv-bootstrap.yml (workflow_dispatch), which
# runs `wrangler kv namespace create` in CI where the CLOUDFLARE_* secrets live.
# Re-run that workflow if the namespace is ever recreated.
id = "c9f6b0b214fd4b9d9137d0c31d781884"

# Custom domain. custom_domain = true makes Cloudflare create and manage the DNS
# record and TLS certificate for this hostname, instead of matching a route
# pattern against an existing zone record. It requires Zone · Workers Routes ·
# Edit on the deploy token — a zone-scoped permission the account-scoped Workers
# Scripts / Workers KV grants do not cover.
[[routes]]
pattern = "zfb-example-kv-guestbook.takazudomodular.com"
custom_domain = true
