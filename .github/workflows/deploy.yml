# Cloudflare Workers (static assets) deploy for this zfb example.
#
#   build  — always runs (push + PR): install, typecheck (`zfb check`), build
#            (`zfb build`). This is the L3 build-output gate; it needs no
#            Cloudflare credentials, so a fresh clone/fork is green immediately.
#   deploy — push to `main` only: runs `wrangler deploy`, then smoke-tests the
#            live custom domain. Both steps SELF-SKIP when
#              * secrets.CLOUDFLARE_API_TOKEN is unset, or
#              * wrangler.toml still holds a REPLACE_WITH_* placeholder id.
#            So the repo never shows a red deploy before Cloudflare is wired up.
#
# Enable deploys by adding, in repo Settings -> Secrets and variables -> Actions:
#   CLOUDFLARE_API_TOKEN   token with Account · Workers Scripts: Edit
#                          (+ Workers KV Storage: Edit for the `GUESTBOOK`
#                          namespace, and Account Settings: Read), plus
#                          Zone · Workers Routes: Edit for the custom domain
#                          in wrangler.toml. No AI or D1.
#   CLOUDFLARE_ACCOUNT_ID  target Cloudflare account id
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# cancel-in-progress is an expression, not a flat `true`, because the two event
# types need opposite behavior and the fix has to live at the workflow level:
# a job-level concurrency override on `deploy` can't help — a run-level cancel
# takes the whole run (including the job) down with it, and job-level
# `cancel-in-progress: false` is already the default anyway. This block scopes
# the whole RUN, not a single job. On `push` it evaluates to false, so a run
# already executing `wrangler deploy` is left alone and a second push to main
# queues behind it instead of cancelling it mid-flight. On `pull_request` it
# stays true, so superseded PR builds are still cancelled as before (only
# `build` runs there — `deploy` is gated on `github.event_name == 'push'`).
#
# Accepted limitation: GitHub keeps at most one *pending* run per group and
# cancels an older pending run when a newer one arrives. Two rapid pushes to
# main both complete, but a third (and later) pending push is cancelled while
# still queued and shows as a red X — the in-flight deploy itself is never
# interrupted, which is the actual bug this fixes.
#
# Considered and rejected: `queue: max` gives true FIFO queueing (up to 100
# pending runs) instead of the single-pending-slot behavior above, but it is a
# validation error when combined with `cancel-in-progress: true` on the same
# workflow, so adopting it would mean splitting `deploy` into its own
# workflow file. Not worth it for this repo's traffic.
#
# The group has no `github.workflow` prefix; kv-bootstrap.yml declares no
# concurrency of its own, so there's no cross-workflow collision today.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build (typecheck + zfb build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Preflight — is Cloudflare configured?
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping deploy. Add it and CLOUDFLARE_ACCOUNT_ID in repo Settings to enable deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif grep -q "REPLACE_WITH" wrangler.toml; then
            echo "::notice::wrangler.toml still has a REPLACE_WITH_* placeholder — provision the resource, commit the real id, then deploy will run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.preflight.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      # A green `wrangler deploy` only proves the Worker uploaded. Whether the
      # custom domain resolves to it, serves valid TLS, and reaches the KV
      # binding is observable only against the deployed origin. Gated on the same
      # preflight as the deploy, so a skipped deploy skips the smoke test too;
      # the script additionally self-skips (exit 0) while the domain is not yet
      # reachable, and fails loudly on any real HTTP or content problem.
      #
      # SMOKE_REQUIRE_LIVE retires the script's self-skip. The KV namespace id is
      # committed and the domain is attached and serving, so "not reachable yet"
      # can no longer legitimately occur — it is an outage, and must go red
      # rather than quietly exit 0. This is the flag the comment here previously
      # said to turn on alongside the real namespace id.
      - name: Smoke test — is the custom domain live?
        if: steps.preflight.outputs.ready == 'true'
        env:
          SMOKE_REQUIRE_LIVE: "1"
        run: pnpm smoke
